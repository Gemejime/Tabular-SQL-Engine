replicaCount: 1

jemalloc:
  enabled: true
  path: /usr/local/lib/libjemalloc.so

env:
  TABULAR_WORKER_OTEL_ENABLED: "true"
  TABULAR_WORKER_OTEL_EXPORTER_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  TABULAR_WORKER_OTEL_SERVICE_NAME: "rag-tabular-analytics-worker-staging"

keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 6
  pollingInterval: 10
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    threshold: "3"
