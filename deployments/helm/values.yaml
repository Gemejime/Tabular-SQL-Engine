replicaCount: 4

image:
  repository: rag-tabular-analytics-worker
  tag: "0.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  headless: false
  grpcPort: 8815
  httpPort: 8080

resources:
  requests:
    cpu: 2000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 6Gi

terminationGracePeriodSeconds: 30

cache:
  mountPath: /var/cache/tabular-worker
  sizeLimit: 10Gi

jemalloc:
  enabled: false
  path: /usr/lib/x86_64-linux-gnu/libjemalloc.so

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

env:
  TABULAR_WORKER_POOL_SIZE: "4"
  TABULAR_WORKER_MAX_TASKS_PER_CHILD: "100"
  TABULAR_WORKER_QUERY_TIMEOUT_SECONDS: "5.0"
  TABULAR_WORKER_DUCKDB_TOTAL_MEMORY_BYTES: "2684354560"
  TABULAR_WORKER_DUCKDB_THREADS: "2"
  TABULAR_WORKER_MAX_CONCURRENT_QUERIES: "4"
  TABULAR_WORKER_CACHE_DIR: "/var/cache/tabular-worker"
  TABULAR_WORKER_CACHE_MAX_BYTES: "10737418240"
  TABULAR_WORKER_OTEL_ENABLED: "false"
  TABULAR_WORKER_OTEL_EXPORTER_ENDPOINT: ""
  TABULAR_WORKER_OTEL_SERVICE_NAME: "rag-tabular-analytics-worker"

keda:
  enabled: true
  minReplicaCount: 4
  maxReplicaCount: 24
  pollingInterval: 10
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    threshold: "3"
