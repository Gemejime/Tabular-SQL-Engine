replicaCount: 4

resources:
  requests:
    cpu: 2000m
    memory: 4Gi
  limits:
    cpu: 4000m
    memory: 6Gi

cache:
  mountPath: /var/cache/tabular-worker
  sizeLimit: 10Gi

jemalloc:
  enabled: true
  path: /usr/local/lib/libjemalloc.so

env:
  TABULAR_WORKER_OTEL_ENABLED: "true"
  TABULAR_WORKER_OTEL_EXPORTER_ENDPOINT: "http://otel-collector.monitoring.svc.cluster.local:4317"
  TABULAR_WORKER_OTEL_SERVICE_NAME: "rag-tabular-analytics-worker"

keda:
  enabled: true
  minReplicaCount: 4
  maxReplicaCount: 24
  pollingInterval: 10
  cooldownPeriod: 60
  prometheus:
    serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    threshold: "3"
