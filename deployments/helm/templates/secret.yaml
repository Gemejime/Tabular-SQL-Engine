{{- if and .Values.secrets .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "rag-tabular-analytics-worker-secrets" .Values.env.secretName }}
  labels:
    {{- include "rag-tabular-analytics-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets.data }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
