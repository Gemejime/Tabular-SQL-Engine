{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "rag-tabular-analytics-worker.fullname" . }}
  labels:
    {{- include "rag-tabular-analytics-worker.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "rag-tabular-analytics-worker.fullname" . }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ .Values.keda.prometheus.serverAddress }}
        metricName: tabular_worker_active_queries
        threshold: {{ .Values.keda.prometheus.threshold | quote }}
        query: sum(tabular_worker_active_queries{namespace="{{ .Release.Namespace }}",pod=~"{{ include "rag-tabular-analytics-worker.fullname" . }}-.*"})
{{- end }}
