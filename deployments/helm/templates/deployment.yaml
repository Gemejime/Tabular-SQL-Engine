{{- if and .Values.env.TABULAR_WORKER_CACHE_DIR (ne .Values.env.TABULAR_WORKER_CACHE_DIR .Values.cache.mountPath) -}}
{{- fail (printf "env.TABULAR_WORKER_CACHE_DIR (%s) must match cache.mountPath (%s)" .Values.env.TABULAR_WORKER_CACHE_DIR .Values.cache.mountPath) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-tabular-analytics-worker.fullname" . }}
  labels:
    {{- include "rag-tabular-analytics-worker.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-tabular-analytics-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag-tabular-analytics-worker.selectorLabels" . | nindent 8 }}
      {{- $httpPort := default 8080 .Values.env.TABULAR_WORKER_HTTP_PORT | int | quote }}
      {{- $annotations := merge (dict "prometheus.io/port" $httpPort) (default dict .Values.podAnnotations) }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.runAsGroup }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          ports:
            - name: grpc
              containerPort: {{ default 8815 .Values.env.TABULAR_WORKER_FLIGHT_PORT | int }}
              protocol: TCP
            - name: http
              containerPort: {{ default 8080 .Values.env.TABULAR_WORKER_HTTP_PORT | int }}
              protocol: TCP
          env:
            {{- if .Values.jemalloc.enabled }}
            - name: LD_PRELOAD
              value: {{ .Values.jemalloc.path | quote }}
            {{- end }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: nvme-cache
              mountPath: {{ .Values.cache.mountPath }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nvme-cache
          emptyDir:
            medium: ""
            sizeLimit: {{ .Values.cache.sizeLimit }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
