apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-tabular-analytics-worker-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
    # Production deployments promote pinned release tags via progressive Argo Rollouts canary.
  source:
    repoURL: https://github.com/org/rag-tabular-analytics-worker.git
    targetRevision: main
    path: deployments/helm
    helm:
      releaseName: rag-tabular-analytics-worker
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-tabular-prod
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
