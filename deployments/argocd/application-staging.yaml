apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-tabular-analytics-worker-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Gemejime/Tabular-SQL-Engine.git
    targetRevision: HEAD
    path: deployments/helm
    helm:
      releaseName: rag-tabular-analytics-worker
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-tabular-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
